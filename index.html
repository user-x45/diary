<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひとりごと</title>
<style>
  :root {
    --bg: #f5f5f3;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --sub-text: #8a8a8a;
    --accent: #5b7fff;
    --border: #e5e5e2;
    --danger: #e5484d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card-bg: #212227;
      --text: #ececec;
      --sub-text: #9a9a9a;
      --accent: #7c9cff;
      --border: #33343a;
      --danger: #ff6b6f;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    text-align: center;
  }

  #login-view, #main-view {
    display: none;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  input[type="password"], textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
  }

  textarea {
    min-height: 90px;
  }

  button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .post-form {
    margin-bottom: 28px;
  }

  .posts {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .post {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }

  .post-content {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    font-size: 15px;
  }

  .post-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .post-time {
    color: var(--sub-text);
    font-size: 12px;
  }

  .delete-btn {
    background: transparent;
    color: var(--sub-text);
    padding: 2px 8px;
    margin-top: 0;
    font-size: 12px;
  }

  .delete-btn:hover {
    color: var(--danger);
  }

  .empty {
    text-align: center;
    color: var(--sub-text);
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>ひとりごと</h1>

  <div id="login-view">
    <div class="card">
      <input type="password" id="password-input" placeholder="パスワード">
      <button id="login-btn">入る</button>
      <div class="error" id="login-error">パスワードが違います</div>
    </div>
  </div>

  <div id="main-view">
    <div class="card post-form">
      <textarea id="content-input" placeholder="今日のひとりごと..."></textarea>
      <button id="post-btn">投稿する</button>
      <div class="error" id="post-error">投稿に失敗しました</div>
    </div>
    <div class="posts" id="posts-list"></div>
  </div>
</div>

<script>
  const API_BASE = "https://diary-server.user-x45.workers.dev";
  const STORAGE_KEY = "hitorigoto_password";

  const loginView = document.getElementById("login-view");
  const mainView = document.getElementById("main-view");
  const passwordInput = document.getElementById("password-input");
  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");
  const contentInput = document.getElementById("content-input");
  const postBtn = document.getElementById("post-btn");
  const postError = document.getElementById("post-error");
  const postsList = document.getElementById("posts-list");

  const getPassword = () => localStorage.getItem(STORAGE_KEY) || "";
  const setPassword = (pw) => localStorage.setItem(STORAGE_KEY, pw);
  const clearPassword = () => localStorage.removeItem(STORAGE_KEY);

  const formatTime = (ts) => {
    const d = new Date(ts);
    return d.toLocaleString("ja-JP", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
  };

  const renderPosts = (posts) => {
    postsList.innerHTML = "";
    if (posts.length === 0) {
      postsList.innerHTML = '<div class="empty">まだ投稿がありません</div>';
      return;
    }
    for (const post of posts) {
      const el = document.createElement("div");
      el.className = "post";
      el.innerHTML = `
        <div class="post-content"></div>
        <div class="post-meta">
          <span class="post-time">${formatTime(post.createdAt)}</span>
          <button class="delete-btn" data-id="${post.id}">削除</button>
        </div>
      `;
      el.querySelector(".post-content").textContent = post.content;
      postsList.appendChild(el);
    }
  };

  const loadPosts = async () => {
    const res = await fetch(`${API_BASE}/api/posts`, {
      headers: { "X-Password": getPassword() }
    });
    if (res.status === 401) {
      clearPassword();
      showLogin();
      return;
    }
    const posts = await res.json();
    renderPosts(posts);
  };

  const showMain = async () => {
    loginView.style.display = "none";
    mainView.style.display = "block";
    await loadPosts();
  };

  const showLogin = () => {
    mainView.style.display = "none";
    loginView.style.display = "block";
    passwordInput.value = "";
    passwordInput.focus();
  };

  const tryLogin = async () => {
    const pw = passwordInput.value;
    if (!pw) return;
    const res = await fetch(`${API_BASE}/api/posts`, {
      headers: { "X-Password": pw }
    });
    if (res.ok) {
      setPassword(pw);
      loginError.style.display = "none";
      await showMain();
    } else {
      loginError.style.display = "block";
    }
  };

  loginBtn.addEventListener("click", tryLogin);
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryLogin();
  });

  postBtn.addEventListener("click", async () => {
    const content = contentInput.value.trim();
    if (!content) return;
    postBtn.disabled = true;
    postError.style.display = "none";
    try {
      const res = await fetch(`${API_BASE}/api/posts`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Password": getPassword()
        },
        body: JSON.stringify({ content })
      });
      if (!res.ok) throw new Error("failed");
      contentInput.value = "";
      await loadPosts();
    } catch {
      postError.style.display = "block";
    } finally {
      postBtn.disabled = false;
    }
  });

  postsList.addEventListener("click", async (e) => {
    if (!e.target.classList.contains("delete-btn")) return;
    const id = e.target.dataset.id;
    if (!confirm("削除しますか？")) return;
    await fetch(`${API_BASE}/api/posts/${id}`, {
      method: "DELETE",
      headers: { "X-Password": getPassword() }
    });
    await loadPosts();
  });

  const init = () => {
    const pw = getPassword();
    if (pw) {
      showMain();
    } else {
      showLogin();
    }
  };

  init();
</script>
</body>
</html>
