<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひとりごと</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #f5f5f3;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --sub-text: #8a8a8a;
    --accent: #5b7fff;
    --border: #e5e5e2;
    --danger: #e5484d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card-bg: #212227;
      --text: #ececec;
      --sub-text: #9a9a9a;
      --accent: #7c9cff;
      --border: #33343a;
      --danger: #ff6b6f;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    text-align: center;
  }

  #login-view, #main-view {
    display: none;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  input[type="password"], textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    resize: none;
  }

  textarea {
    min-height: 90px;
  }

  button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .post-form {
    margin-bottom: 28px;
  }

  .top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--sub-text);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    margin-top: 0;
  }

  .logout-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  .posts {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .post {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }

  .post-content {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    font-size: 15px;
  }

  .post-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .post-time {
    color: var(--sub-text);
    font-size: 12px;
  }

  .delete-btn {
    background: transparent;
    color: var(--sub-text);
    padding: 2px 8px;
    margin-top: 0;
    font-size: 12px;
  }

  .delete-btn:hover {
    color: var(--danger);
  }

  .empty {
    text-align: center;
    color: var(--sub-text);
    padding: 40px 0;
    font-size: 14px;
  }

  .loading {
    display: flex;
    justify-content: center;
    padding: 40px 0;
  }

  .loading .spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-width: 3px;
    border-color: var(--border);
    border-top-color: var(--accent);
  }

  .post-btn-content {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .spinner.active {
    display: inline-block;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 10px;
    margin-bottom: 16px;
  }

  .search-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .search-wrap i {
    flex-shrink: 0;
    color: var(--sub-text);
    font-size: 14px;
  }

  .filter-bar input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 10px 0;
    font-size: 16px;
    font-family: inherit;
  }

  .filter-bar input[type="text"]:focus {
    outline: none;
  }

  .filter-divider {
    width: 1px;
    height: 20px;
    background: var(--border);
    flex-shrink: 0;
  }

  .date-trigger {
    background: transparent;
    border: none;
    color: var(--sub-text);
    padding: 6px 8px;
    margin-top: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
  }

  .date-trigger:hover {
    color: var(--accent);
  }

  .date-trigger.active {
    color: var(--accent);
  }

  #date-trigger-label {
    font-size: 12px;
    font-weight: 500;
  }

  .date-filter-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .calendar-popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    width: 260px;
    z-index: 20;
    display: none;
  }

  .calendar-popover.active {
    display: block;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .calendar-header span {
    font-size: 14px;
    font-weight: 600;
  }

  .calendar-nav-btn {
    background: transparent;
    border: none;
    color: var(--sub-text);
    padding: 4px 8px;
    margin-top: 0;
    font-size: 13px;
  }

  .calendar-nav-btn:hover {
    color: var(--accent);
  }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }

  .calendar-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--sub-text);
  }

  .calendar-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .calendar-day {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 0;
    margin-top: 0;
    font-size: 13px;
    font-weight: 400;
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calendar-day:hover {
    background: var(--bg);
  }

  .calendar-day.other-month {
    color: var(--sub-text);
    opacity: 0.35;
  }

  .calendar-day.selected {
    background: var(--accent);
    color: #fff;
  }

  .calendar-today {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .filter-clear {
    background: transparent;
    border: none;
    color: var(--sub-text);
    padding: 6px;
    margin-top: 0;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .filter-clear.active {
    display: inline-flex;
  }

  .filter-clear:hover {
    color: var(--danger);
    background: var(--bg);
  }

  .post-actions {
    display: flex;
    gap: 6px;
  }

  .edit-btn, .delete-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .edit-btn {
    background: transparent;
    color: var(--sub-text);
    padding: 2px 8px;
    margin-top: 0;
    font-size: 12px;
  }

  .edit-btn:hover {
    color: var(--accent);
  }

  .edit-textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    min-height: 80px;
  }

  .edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .edit-save-btn {
    padding: 6px 14px;
    margin-top: 0;
    font-size: 13px;
  }

  .edit-cancel-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--sub-text);
    padding: 6px 14px;
    margin-top: 0;
    font-size: 13px;
  }

  .edited-tag {
    color: var(--sub-text);
    font-size: 11px;
    margin-left: 6px;
  }

  .login-btn-content {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>ひとりごと</h1>

  <div id="login-view">
    <div class="card">
      <input type="password" id="password-input" placeholder="パスワード">
      <button id="login-btn">
        <span class="login-btn-content">
          <span class="spinner" id="login-spinner"></span>
          <span id="login-btn-label">入る</span>
        </span>
      </button>
      <div class="error" id="login-error">パスワードが違います</div>
    </div>
  </div>

  <div id="main-view">
    <div class="top-bar">
      <button class="logout-btn" id="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
    </div>
    <div class="card post-form">
      <textarea id="content-input" placeholder="今日のひとりごと..."></textarea>
      <button id="post-btn">
        <span class="post-btn-content">
          <span class="spinner" id="post-spinner"></span>
          <i class="fa-solid fa-paper-plane" id="post-btn-icon"></i>
          <span id="post-btn-label">投稿する</span>
        </span>
      </button>
      <div class="error" id="post-error">投稿に失敗しました</div>
    </div>
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="検索">
      </div>
      <button class="filter-clear" id="filter-clear-btn" title="クリア">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="filter-divider"></div>
      <div class="date-filter-wrap">
        <button class="date-trigger" id="date-trigger-btn" title="日付で絞り込み">
          <i class="fa-regular fa-calendar"></i>
          <span id="date-trigger-label"></span>
        </button>
        <div class="calendar-popover" id="calendar-popover">
          <div class="calendar-header">
            <button class="calendar-nav-btn" id="calendar-prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="calendar-title"></span>
            <button class="calendar-nav-btn" id="calendar-next-btn"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="calendar-weekdays">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div class="calendar-days" id="calendar-days"></div>
        </div>
      </div>
    </div>
    <div class="posts" id="posts-list"></div>
  </div>
</div>

<script>
  const API_BASE = "https://diary-server.user-x45.workers.dev";
  const STORAGE_KEY = "hitorigoto_password";

  const loginView = document.getElementById("login-view");
  const mainView = document.getElementById("main-view");
  const passwordInput = document.getElementById("password-input");
  const loginBtn = document.getElementById("login-btn");
  const loginSpinner = document.getElementById("login-spinner");
  const loginBtnLabel = document.getElementById("login-btn-label");
  const loginError = document.getElementById("login-error");
  const contentInput = document.getElementById("content-input");
  const postBtn = document.getElementById("post-btn");
  const postSpinner = document.getElementById("post-spinner");
  const postBtnLabel = document.getElementById("post-btn-label");
  const postError = document.getElementById("post-error");
  const postsList = document.getElementById("posts-list");
  const searchInput = document.getElementById("search-input");
  const dateTriggerBtn = document.getElementById("date-trigger-btn");
  const dateTriggerLabel = document.getElementById("date-trigger-label");
  const calendarPopover = document.getElementById("calendar-popover");
  const calendarTitle = document.getElementById("calendar-title");
  const calendarDays = document.getElementById("calendar-days");
  const calendarPrevBtn = document.getElementById("calendar-prev-btn");
  const calendarNextBtn = document.getElementById("calendar-next-btn");
  const filterClearBtn = document.getElementById("filter-clear-btn");
  const postBtnIcon = document.getElementById("post-btn-icon");

  let posts = [];
  let editingId = null;
  let selectedDateValue = "";
  let calendarViewYear = new Date().getFullYear();
  let calendarViewMonth = new Date().getMonth();

  const getPassword = () => localStorage.getItem(STORAGE_KEY) || "";
  const setPassword = (pw) => localStorage.setItem(STORAGE_KEY, pw);
  const clearPassword = () => localStorage.removeItem(STORAGE_KEY);

  const formatTime = (ts) => {
    const d = new Date(ts);
    return d.toLocaleString("ja-JP", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
  };

  const toDateInputValue = (ts) => {
    const d = new Date(ts);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  };

  const getFilteredPosts = () => {
    const keyword = searchInput.value.trim().toLowerCase();
    return posts.filter((post) => {
      if (keyword && !post.content.toLowerCase().includes(keyword)) return false;
      if (selectedDateValue && toDateInputValue(post.createdAt) !== selectedDateValue) return false;
      return true;
    });
  };

  const renderPosts = () => {
    const filtered = getFilteredPosts();
    postsList.innerHTML = "";
    if (posts.length === 0) {
      postsList.innerHTML = '<div class="empty">まだ投稿がありません</div>';
      return;
    }
    if (filtered.length === 0) {
      postsList.innerHTML = '<div class="empty">該当する投稿がありません</div>';
      return;
    }
    for (const post of filtered) {
      const el = document.createElement("div");
      el.className = "post";
      if (editingId === post.id) {
        el.innerHTML = `
          <textarea class="edit-textarea" data-edit-id="${post.id}"></textarea>
          <div class="edit-actions">
            <button class="edit-save-btn" data-save-id="${post.id}">保存</button>
            <button class="edit-cancel-btn" data-cancel-id="${post.id}">キャンセル</button>
          </div>
          <div class="error" id="edit-error-${post.id}" style="display:none;">更新に失敗しました</div>
        `;
        el.querySelector("textarea").value = post.content;
      } else {
        const editedTag = post.updatedAt ? '<span class="edited-tag">(編集済み)</span>' : "";
        el.innerHTML = `
          <div class="post-content"></div>
          <div class="post-meta">
            <span class="post-time">${formatTime(post.createdAt)}${editedTag}</span>
            <div class="post-actions">
              <button class="edit-btn" data-id="${post.id}"><i class="fa-solid fa-pen"></i> 編集</button>
              <button class="delete-btn" data-id="${post.id}"><i class="fa-solid fa-trash"></i> 削除</button>
            </div>
          </div>
        `;
        el.querySelector(".post-content").textContent = post.content;
      }
      postsList.appendChild(el);
    }
  };

  const showPostsLoading = () => {
    postsList.innerHTML = '<div class="loading"><span class="spinner active"></span></div>';
  };

  const loadPosts = async () => {
    showPostsLoading();
    const res = await fetch(`${API_BASE}/api/posts`, {
      headers: { "X-Password": getPassword() }
    });
    if (res.status === 401) {
      clearPassword();
      showLogin();
      return;
    }
    posts = await res.json();
    renderPosts();
  };

  const showMain = async () => {
    loginView.style.display = "none";
    mainView.style.display = "block";
    await loadPosts();
  };

  const showLogin = () => {
    mainView.style.display = "none";
    loginView.style.display = "block";
    passwordInput.value = "";
    passwordInput.focus();
  };

  const tryLogin = async () => {
    const pw = passwordInput.value;
    if (!pw) return;
    loginBtn.disabled = true;
    loginSpinner.classList.add("active");
    loginBtnLabel.textContent = "確認中...";
    loginError.style.display = "none";
    try {
      const res = await fetch(`${API_BASE}/api/posts`, {
        headers: { "X-Password": pw }
      });
      if (res.ok) {
        setPassword(pw);
        await showMain();
      } else {
        loginError.style.display = "block";
      }
    } finally {
      loginBtn.disabled = false;
      loginSpinner.classList.remove("active");
      loginBtnLabel.textContent = "入る";
    }
  };

  loginBtn.addEventListener("click", tryLogin);
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryLogin();
  });

  postBtn.addEventListener("click", async () => {
    const content = contentInput.value.trim();
    if (!content) return;
    postBtn.disabled = true;
    postSpinner.classList.add("active");
    postBtnIcon.style.display = "none";
    postBtnLabel.textContent = "投稿中...";
    postError.style.display = "none";
    try {
      const res = await fetch(`${API_BASE}/api/posts`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Password": getPassword()
        },
        body: JSON.stringify({ content })
      });
      if (!res.ok) throw new Error("failed");
      const newPost = await res.json();
      posts.unshift(newPost);
      renderPosts();
      contentInput.value = "";
    } catch {
      postError.style.display = "block";
    } finally {
      postBtn.disabled = false;
      postSpinner.classList.remove("active");
      postBtnIcon.style.display = "inline-block";
      postBtnLabel.textContent = "投稿する";
    }
  });

  postsList.addEventListener("click", async (e) => {
    const editBtn = e.target.closest(".edit-btn");
    const deleteBtn = e.target.closest(".delete-btn");
    const saveBtn = e.target.closest(".edit-save-btn");
    const cancelBtn = e.target.closest(".edit-cancel-btn");

    if (editBtn) {
      editingId = editBtn.dataset.id;
      renderPosts();
      return;
    }

    if (cancelBtn) {
      editingId = null;
      renderPosts();
      return;
    }

    if (saveBtn) {
      const saveId = saveBtn.dataset.saveId;
      const textarea = postsList.querySelector(`textarea[data-edit-id="${saveId}"]`);
      const content = textarea.value.trim();
      const errorEl = document.getElementById(`edit-error-${saveId}`);
      if (!content) return;
      saveBtn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/posts/${saveId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Password": getPassword()
          },
          body: JSON.stringify({ content })
        });
        if (!res.ok) throw new Error("failed");
        const updated = await res.json();
        posts = posts.map((p) => (p.id === saveId ? updated : p));
        editingId = null;
        renderPosts();
      } catch {
        if (errorEl) errorEl.style.display = "block";
        saveBtn.disabled = false;
      }
      return;
    }

    if (deleteBtn) {
      const deleteId = deleteBtn.dataset.id;
      if (!confirm("削除しますか？")) return;
      const res = await fetch(`${API_BASE}/api/posts/${deleteId}`, {
        method: "DELETE",
        headers: { "X-Password": getPassword() }
      });
      if (res.ok) {
        posts = posts.filter((p) => p.id !== deleteId);
        renderPosts();
      }
    }
  });

  const updateFilterClearVisibility = () => {
    const active = searchInput.value.trim() !== "" || selectedDateValue !== "";
    filterClearBtn.classList.toggle("active", active);
    dateTriggerBtn.classList.toggle("active", selectedDateValue !== "");
    if (selectedDateValue) {
      const [y, m, d] = selectedDateValue.split("-");
      dateTriggerLabel.textContent = `${m}/${d}`;
    } else {
      dateTriggerLabel.textContent = "";
    }
  };

  const renderCalendar = () => {
    calendarTitle.textContent = `${calendarViewYear}年${calendarViewMonth + 1}月`;
    calendarDays.innerHTML = "";
    const firstDay = new Date(calendarViewYear, calendarViewMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(calendarViewYear, calendarViewMonth, 0).getDate();
    const todayValue = toDateInputValue(Date.now());
    const cells = [];

    for (let i = startOffset - 1; i >= 0; i--) {
      cells.push({ day: daysInPrevMonth - i, otherMonth: true, monthOffset: -1 });
    }
    for (let day = 1; day <= daysInMonth; day++) {
      cells.push({ day, otherMonth: false, monthOffset: 0 });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ day: cells.length - startOffset - daysInMonth + 1, otherMonth: true, monthOffset: 1 });
    }

    for (const cell of cells) {
      const cellMonth = calendarViewMonth + cell.monthOffset;
      const cellDate = new Date(calendarViewYear, cellMonth, cell.day);
      const cellValue = toDateInputValue(cellDate.getTime());
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "calendar-day";
      if (cell.otherMonth) btn.classList.add("other-month");
      if (cellValue === selectedDateValue) btn.classList.add("selected");
      if (cellValue === todayValue) btn.classList.add("calendar-today");
      btn.textContent = cell.day;
      btn.dataset.value = cellValue;
      calendarDays.appendChild(btn);
    }
  };

  const openCalendar = () => {
    if (selectedDateValue) {
      const [y, m] = selectedDateValue.split("-");
      calendarViewYear = Number(y);
      calendarViewMonth = Number(m) - 1;
    }
    renderCalendar();
    calendarPopover.classList.add("active");
  };

  const closeCalendar = () => {
    calendarPopover.classList.remove("active");
  };

  dateTriggerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (calendarPopover.classList.contains("active")) {
      closeCalendar();
    } else {
      openCalendar();
    }
  });

  calendarPopover.addEventListener("click", (e) => {
    e.stopPropagation();
    const dayBtn = e.target.closest(".calendar-day");
    if (dayBtn) {
      selectedDateValue = dayBtn.dataset.value;
      updateFilterClearVisibility();
      renderPosts();
      closeCalendar();
    }
  });

  calendarPrevBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    calendarViewMonth -= 1;
    if (calendarViewMonth < 0) {
      calendarViewMonth = 11;
      calendarViewYear -= 1;
    }
    renderCalendar();
  });

  calendarNextBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    calendarViewMonth += 1;
    if (calendarViewMonth > 11) {
      calendarViewMonth = 0;
      calendarViewYear += 1;
    }
    renderCalendar();
  });

  document.addEventListener("click", (e) => {
    if (!calendarPopover.contains(e.target) && e.target !== dateTriggerBtn) {
      closeCalendar();
    }
  });

  searchInput.addEventListener("input", () => {
    updateFilterClearVisibility();
    renderPosts();
  });
  filterClearBtn.addEventListener("click", () => {
    searchInput.value = "";
    selectedDateValue = "";
    updateFilterClearVisibility();
    renderPosts();
  });

  window.handleLogout = () => {
    clearPassword();
    showLogin();
  };

  const init = () => {
    const pw = getPassword();
    if (pw) {
      showMain();
    } else {
      showLogin();
    }
  };

  init();
</script>
</body>
</html>
